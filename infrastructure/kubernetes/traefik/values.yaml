deployment:
  replicas: 1

hostNetwork: true

providers:
  kubernetesGateway:
    enabled: true
    experimentalChannel: false
    statusAddress:
      service:
        namespace: traefik
        name: traefik
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: false

gateway:
  enabled: false

gatewayClass:
  enabled: true

service:
  enabled: true
  type: ClusterIP

ports:
  web:
    port: 80
    hostPort: 80
    expose:
      default: true
  websecure:
    port: 443
    hostPort: 443
    expose:
      default: true

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    level: INFO
  access:
    enabled: false

metrics:
  prometheus:
    service:
      enabled: false

securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
