apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rsshub

resources:
  - namespace.yaml
  - rsshub-deployment.yaml
  - rsshub-service.yaml
  - httproute.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: rsshub

patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 2
